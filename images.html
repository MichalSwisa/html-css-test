<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="images.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title>Document</title>
</head>

<body>
    <section class="top-bar">
        <i class="fa-brands fa-openai"></i>
        <select name="menu" id="menu">
            <option value="">ChatGPT</option>
        </select>
        <nav class="nav-menu">
            <a href="index.html">Index</a>
            <a href="images.html">Images</a>
            <a href="agent.html">Agent</a>
        </nav>
        <div class="right-btn">
            <button onclick="login" id="l-btn">Log in</button>
            <button onclick="signup" id="s-btn">Sign up for free</button>
            <i id="question-icon" class="fa-regular fa-circle-question"></i>
        </div>

    </section>




    <section class="images-section">
        <h2>Images</h2>
        <div class="title">
            <h4>Try a style on an image</h4>
            <i class="fa-solid fa-angle-left" id="left-arrow"></i>
            <i class="fa-solid fa-angle-right" id="right-arrow"></i>
        </div>
        <div class="pictures">
            <figure>
                <img src="img/pic1.png" alt="Sketch">
                <figcaption>Sketch</figcaption>
            </figure>
            <figure>
                <img src="img/pic2.png" alt="Dramatic">
                <figcaption>Dramatic</figcaption>
            </figure>
            <figure>
                <img src="img/pic3.png" alt="Plushie">
                <figcaption>Plushie</figcaption>
            </figure>
            <figure>
                <img src="img/pic4.png" alt="Retro Anime">
                <figcaption>Retro Anime</figcaption>
            </figure>
            <figure>
                <img src="img/pic5.png" alt="Baseball Bobblehead">
                <figcaption>Baseball Bobblehead</figcaption>
            </figure>
            <figure>
                <img src="img/pic6.png" alt="Doddle">
                <figcaption>Doddle</figcaption>
            </figure>
        </div>
        <div class="discover">
            <div class="title">
                <h4>Discover something new</h4>
                <i class="fa-solid fa-angle-left" id="left-arrow"></i>
                <i class="fa-solid fa-angle-right" id="right-arrow"></i>
            </div>
            <div "discover-options">
                <div class="option" id="option1">
                    <img src="img/discover1.png" alt="Discover 1">
                    <figcaption>Discover 1</figcaption>
                </div>
                <div class="option" id="option2">
                    <img src="img/discover2.png" alt="Discover 2">
                    <figcaption>Discover 2</figcaption>
                </div>
                <div class="option" id="option3">
                    <img src="img/discover3.png" alt="Discover 3">
                    <figcaption>Discover 3</figcaption>
                </div>
                <div class="option" id="option4">
                    <img src="img/discover4.png" alt="Discover 4">
                    <figcaption>Discover 4</figcaption>
                </div>
                <div class="option" id="option5">
                    <img src="img/discover5.png" alt="Discover 5">
                    <figcaption>Discover 5</figcaption>
                </div>
                <div class="option" id="option6">
                    <img src="img/discover6.png" alt="Discover 6">
                    <figcaption>Discover 6</figcaption>
                </div>
            </div>


        </div>
    </section>
</body>

</html>
